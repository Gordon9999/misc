<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清单 · 新加坡 + 悉尼 · 11/16–11/24</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f7f2e9; color:#3a332a; font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; padding:28px 16px 60px; }
  .wrap { max-width:960px; margin:0 auto; }
  .kicker { color:#b0764f; font-size:13px; letter-spacing:2px; margin-bottom:6px; }
  h1 { font-family:"Songti SC","Noto Serif SC",Georgia,serif; font-size:30px; font-weight:600; margin-bottom:12px; }
  .nav { margin:14px 0 24px; font-size:14px; }
  .nav a { color:#b0764f; text-decoration:none; }
  .panel { background:#fbf7ef; border-radius:14px; padding:18px 20px; margin-bottom:14px; }
  .panel h3 { font-family:"Songti SC","Noto Serif SC",Georgia,serif; font-size:18px; margin-bottom:8px; }
  .panel .sub { color:#8a7d6b; font-size:13.5px; line-height:1.8; margin-bottom:8px; }
  .ck label { display:flex; align-items:center; font-size:14.5px; line-height:2; cursor:pointer; }
  .ck input { margin-right:10px; accent-color:#b0764f; }
  .carry { background:#f3ece0; border-radius:12px; padding:12px 16px; margin-top:6px; }
  .carry h4 { font-size:13px; color:#b0764f; letter-spacing:1px; margin-bottom:4px; }
  .carry p { font-size:14px; line-height:1.9; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">天气 · 行李</div>
  <h1>清单</h1>
  <div class="nav"><a href="trip-sg-syd-nov-2026.html">← 返回行程</a></div>

  <div class="panel">
    <h3>新加坡（11/16–19）</h3>
    <div class="sub">25–31°C，湿热，午后多雷阵雨。短袖透气为主，室内商场冷气强，备一件薄外套。防晒必备。</div>
  </div>

  <div class="panel">
    <h3>悉尼（11/19–24）</h3>
    <div class="sub">春末，16–25°C。白天暖、早晚凉、风大，短袖 + 薄外套/长袖衬衫最稳。紫外线极强，防晒必备。</div>
  </div>

  <div class="panel ck">
    <h3>行李清单</h3>
    <label><input type="checkbox"><span>护照</span></label>
    <label><input type="checkbox"><span>手机 + 充电器</span></label>
    <label><input type="checkbox"><span>笔记本 + 充电器</span></label>
    <label><input type="checkbox"><span>转换插头（新/澳均可，或万能转换）</span></label>
    <label><input type="checkbox"><span>换洗衣物（短袖为主 + 薄外套）</span></label>
    <label><input type="checkbox"><span>洗漱包</span></label>
    <label><input type="checkbox"><span>防晒霜</span></label>
    <div class="carry">
      <h4>随身宝贝</h4>
      <p>双币卡 · 护照 · 手机</p>
    </div>
  </div>

  <div class="panel">
    <h3>行李规定</h3>
    <div class="sub">RIMOWA Sleeve 55×39×23（登机箱）。国际段直飞，行李额以出票为准。</div>
  </div>
</div>
<script>
var boxes = document.querySelectorAll('.ck input');
boxes.forEach(function(b){
  var k='pkg-'+b.nextElementSibling.textContent.trim();
  if(localStorage.getItem(k)==='1') b.checked=true;
  b.addEventListener('change',function(){localStorage.setItem(k,b.checked?'1':'0')});
});
</script>
</body>
</html>
